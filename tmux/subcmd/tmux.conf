# -- subcmd: live subcommand hints (status bar) + picker popup ----------
# status bar shows subcommands of the command you're typing, e.g.
#   ⚡ git ❯ status·add·commit·push·pull·diff
#
# touch (Termux): tap ALT, then tap TAB (modifiers are sticky) to open
# the picker; tap a row to insert it. prefix + TAB works too.

set -g @subcmd_hint ""
set -g status-right-length 120
set -g status-right '#[fg=colour45]#{@subcmd_hint}#[default] "#H" %H:%M %d-%b-%y'

# no-prefix trigger for phones: ALT then TAB
bind-key -n M-Tab display-popup -E -w 95% -h 45% \
    '$HOME/.config/subcmd/subcmd-popup "#{pane_id}"'
# classic trigger: prefix then TAB
bind-key Tab display-popup -E -w 95% -h 45% \
    '$HOME/.config/subcmd/subcmd-popup "#{pane_id}"'

# keep the poller alive (spawned on server start, guarded by pidfile)
run -b '$HOME/.config/subcmd/subcmd-daemon start'
