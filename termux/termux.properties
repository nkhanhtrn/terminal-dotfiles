### Termux app settings — managed by terminal-dotfiles (install.sh)
### Docs: https://wiki.termux.com/wiki/Terminal_Settings
### Live copy: ~/.termux/termux.properties — run `termux-reload-settings`
### after changes (extra-keys need a Termux app restart to apply).

# extra keys sidebar (single row):
#   KEYBOARD  force-shows the soft keyboard
extra-keys = [[KEYBOARD]]
