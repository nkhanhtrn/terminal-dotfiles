### Termux app settings — managed by terminal-dotfiles (install.sh)
### Docs: https://wiki.termux.com/wiki/Terminal_Settings
### Live copy: ~/.termux/termux.properties — run `termux-reload-settings`
### after changes (extra-keys need a Termux app restart to apply).

# extra keys sidebar (single row, touch-optimized):
#   KEYBOARD  force-shows the soft keyboard
#   ◀W / W▶   switch tmux windows (prefix p / prefix n)
#   +W        create a new tmux window / panel (prefix c)
#   ⌫LN       clear the line (CTRL u)
extra-keys = [[ESC, CTRL, TAB, ALT, KEYBOARD, {macro: "CTRL b p", display: "◀W"}, DOWN, UP, {macro: "CTRL b n", display: "W▶"}, {macro: "CTRL b c", display: "+W"}, {macro: "CTRL u", display: "⌫LN"}]]
